name: CalendarHijri
options:
  bundleIdPrefix: com.macwidget
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CalendarHijri:
    type: application
    platform: macOS
    sources:
      - path: CalendarHijri
      - path: Shared
    dependencies:
      - target: HijriWidget
        embed: true
    info:
      path: CalendarHijri/Info.plist
      properties:
        CFBundleDisplayName: Calendar Hijri
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHumanReadableCopyright: ""

  HijriWidget:
    type: app-extension
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macwidget.CalendarHijri.HijriWidget
    sources:
      - path: HijriWidget
      - path: Shared
    info:
      path: HijriWidget/Info.plist
      properties:
        CFBundleDisplayName: Hijri Calendar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
